<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05040b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Castaway Miner</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9169155228115968" crossorigin="anonymous"></script>
<style>
:root{--bg:#07060d;--p:#141221;--p2:#1d1a30;--ln:#332c52;--tx:#f1eefb;--mu:#9d95ba;--ac:#ffb648;--ac2:#ffd88a;--ok:#62e0a2;--bad:#ff6b6b;--cy:#6fe3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#000;color:var(--tx);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#app{position:relative;height:100%;max-width:760px;margin:0 auto;overflow:hidden;background:#000}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.layer{position:absolute;inset:0;display:none}
.layer.show{display:flex}
.btn{padding:11px 16px;border-radius:12px;background:var(--ac);color:#2a1700;font-weight:800}
.btn.s{background:rgba(29,26,48,.92);color:var(--tx);border:1px solid var(--ln)}
.btn.g{background:linear-gradient(#7af0c0,#3cc58c);color:#062016}
.btn:disabled{opacity:.4}
.mu{color:var(--mu);font-size:12px}
.gem{display:inline-block;width:.8em;height:.8em;transform:rotate(45deg);border-radius:2px;margin:0 .25em .05em .1em;vertical-align:middle}
/* MENU */
#menu{flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px calc(40px + env(safe-area-inset-bottom));background:linear-gradient(transparent 30%,rgba(0,0,0,.75))}
#menu h1{margin:0;font-size:40px;line-height:1;font-weight:900;letter-spacing:2px;text-align:center;background:linear-gradient(#fff,#ffd88a 60%,#ff9a3c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 12px rgba(255,150,60,.35))}
#menu .tag{color:var(--cy);letter-spacing:4px;font-size:12px;margin:8px 0 26px;text-transform:uppercase;text-align:center}
#menu .btn{width:100%;max-width:320px;margin-top:10px;font-size:16px;padding:14px}
#menu .save{margin-top:14px;font-size:12px;color:var(--mu)}
/* HUD */
#hud{flex-direction:column;pointer-events:none;padding:10px 12px}
.o2{display:flex;align-items:center;gap:8px;font-weight:900;text-shadow:0 2px 4px #000}
.o2 .bar{flex:1;height:14px;border-radius:9px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);overflow:hidden}
.o2 .bar i{display:block;height:100%;background:linear-gradient(90deg,#3cc5ff,#7af0ff);transition:width .1s linear}
.o2 .bar.low i{background:linear-gradient(90deg,#ff4d4d,#ff9a3c)} .o2 .bar.warn i{background:linear-gradient(90deg,#ffb648,#ffe27a)}
#o2t{font-size:20px;min-width:62px;text-align:right;font-variant-numeric:tabular-nums}
#gain{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{white-space:nowrap;flex-shrink:0;background:rgba(10,8,20,.7);border:1px solid var(--ln);border-radius:9px;padding:3px 8px;font-weight:800;font-size:13px}
#toolBadge{position:absolute;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));background:rgba(10,8,20,.75);border:1px solid var(--ln);border-radius:12px;padding:6px 10px;font-size:12px;font-weight:700}
#bombBtn{position:absolute;left:12px;bottom:calc(16px + env(safe-area-inset-bottom));pointer-events:auto;padding:12px 16px;border-radius:14px;background:linear-gradient(#ff8a5c,#d9482b);color:#fff;font-weight:900;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
#bombBtn:active{transform:scale(.94)}
#hint{position:absolute;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));text-align:center;font-weight:800;text-shadow:0 2px 6px #000;opacity:.9}
#vign{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(255,0,0,.55);opacity:0;transition:opacity .3s}
/* HUB */
#hub{flex-direction:column}
.hubtop{padding:10px 12px 6px;background:linear-gradient(rgba(5,4,11,.95),rgba(5,4,11,.55) 80%,transparent)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:6px}
#pname{font-weight:900;font-size:16px}
#inv{display:flex;gap:5px;overflow-x:auto;margin-top:7px;padding-bottom:2px;scrollbar-width:none}
#inv::-webkit-scrollbar{display:none}
.iconbtn{width:38px;height:38px;border-radius:11px;background:rgba(29,26,48,.9);border:1px solid var(--ln);font-size:17px}
.sheet{margin-top:auto;height:58%;background:var(--p2);border-top:1px solid var(--ln);border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.6)}
.tabs{display:flex;padding:8px 8px 0;gap:4px}
.tabs button{flex:1 1 auto;padding:8px 3px;min-height:44px;border-radius:10px;background:none;color:var(--mu);font-weight:800;font-size:11.5px;white-space:nowrap;letter-spacing:-.2px}
.tabs button.on{background:var(--p);color:var(--tx)}
.tabs button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-left:3px;vertical-align:top}
#pane{flex:1;position:relative;overflow:hidden}
.scroll{position:absolute;inset:0;overflow:auto;padding:10px;-webkit-overflow-scrolling:touch}
#treeIn{position:relative}
#treeIn svg{position:absolute;left:0;top:0;pointer-events:none}
.node{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--p);border:3px solid var(--ln);font-size:23px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.node .sgb{position:absolute;top:-6px;right:-6px;font-size:10.5px;font-weight:900;background:#8a5cff;color:#fff;border-radius:8px;padding:1px 5px}
.node .lv{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:800;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:0 5px;white-space:nowrap}
.node.can{border-color:var(--ac);animation:pulse 1.4s infinite}
.node.max{border-color:var(--ok)}
.node.lock{opacity:.28;filter:grayscale(1)}
.node.tool{border-radius:14px}
.node.sel{outline:3px solid #fff;outline-offset:2px}
#tuto{position:fixed;inset:0;z-index:45;pointer-events:none;display:none}#tuto.show{display:block}
#tuto .tHole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(4,3,10,.74);border:2px solid #ffb648;transition:all .25s;pointer-events:none}
#tuto .tBub{position:fixed;left:12px;right:12px;max-width:460px;margin:0 auto;background:linear-gradient(#211b38,#161226);border:2px solid #6fe3ff;border-radius:16px;padding:12px 14px 10px 54px;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.6);font-size:14px;line-height:1.45;color:#fff}
#tuto .tLumi{position:absolute;left:10px;top:10px;font-size:30px;animation:tbob 1.6s ease-in-out infinite}@keyframes tbob{50%{transform:translateY(-4px)}}
#tuto .tRow{display:flex;align-items:center;gap:8px;margin-top:8px}#tuto .tRow .tNum{flex:1;text-align:center;color:#9a90c0;font-size:12px}
#tuto .tSkip{background:none;border:0;color:#9a90c0;font:600 12px system-ui;text-decoration:underline;padding:4px}
#tuto.wait .tHole{animation:thole 1.1s ease-in-out infinite}@keyframes thole{50%{border-color:#fff;box-shadow:0 0 0 9999px rgba(4,3,10,.74),0 0 22px #ffb648}}
#tuto.runm .tHole{display:none}#tuto.runm .tRow{display:none}#tuto.runm .tBub{top:96px;bottom:auto;pointer-events:none;background:rgba(22,18,38,.93)}
.newtab{animation:ntab 1.2s ease-in-out infinite}@keyframes ntab{50%{box-shadow:0 0 0 3px rgba(255,182,72,.75)}}
.eur{opacity:.72;font-size:.78em;font-weight:600;white-space:nowrap}.cos .eur,.skin .eur{display:block}
.blabel{position:absolute;transform:translate(-50%,-50%);font-size:11.5px;font-weight:800;color:var(--mu);letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
@keyframes pulse{50%{box-shadow:0 0 18px rgba(255,182,72,.65)}}
#detail{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(20,18,33,.98);border:1px solid var(--ac);border-radius:14px;padding:10px 12px;display:none;z-index:2}
#detail.show{display:block}
.card{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:8px}
.ct{display:flex;align-items:center;gap:10px}
.ct .ic{font-size:26px;width:38px;text-align:center}
.grow{flex:1;min-width:0}
.nm{font-weight:800}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.req{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.req span{font-size:12px;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--bg)}
.req .ok{color:var(--ok)}.req .no{color:var(--bad)}
.pbar{height:7px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--ac)}
#go{margin:0 10px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
#go .main{flex:1;padding:15px;border-radius:15px;background:linear-gradient(#ffc562,#f39a2e);color:#2a1700;font-size:17px;font-weight:900;box-shadow:0 6px 20px rgba(243,154,46,.35)}
#go .ad{padding:0 12px;border-radius:15px;font-size:12px;font-weight:800;line-height:1.1}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skin{background:var(--p);border:2px solid var(--ln);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px}
.skin.on{border-color:var(--ok)}
.skin canvas{width:64px;height:64px}
.test{font-size:12px;color:#ffcf6b;background:rgba(255,182,72,.1);border:1px dashed rgba(255,182,72,.5);border-radius:8px;padding:6px 8px;margin-bottom:8px}
#lumi{position:absolute;left:12px;right:12px;top:118px;background:rgba(8,14,24,.92);border:1px solid rgba(111,227,255,.55);border-radius:14px;padding:8px 11px;font-size:13px;line-height:1.4;opacity:0;transform:translateY(-6px);transition:opacity .4s,transform .4s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#lumi.show{opacity:1;transform:none}
#tx{flex-direction:column;background:#020208;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
#txhead{text-align:center;color:#ff6b6b;font-weight:900;letter-spacing:3px;font-size:12px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
#txc{width:100%;height:36%;border-radius:12px;margin-top:10px;border:1px solid #233;background:#000}
#txfrom{margin-top:10px;font-weight:900;font-size:15px}
#txtext{flex:1;overflow:auto;margin-top:6px;font-size:15px;line-height:1.5}
#txtext p{margin:0 0 9px;animation:fadein .5s}
#txtext .lumi{color:var(--cy)}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}
#txbtns{display:flex;flex-direction:column;gap:8px;margin-top:8px}
#txbtns .btn{text-align:left;font-size:14px}
/* AIDE LUMI */
.tipb{position:absolute;top:-9px;right:-9px;font-size:16px;filter:drop-shadow(0 0 6px #ffd23f);animation:bob 1.2s infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.lumitip{margin-top:8px;font-size:12px;color:var(--cy);line-height:1.4;background:rgba(111,227,255,.07);border-radius:8px;padding:6px 8px}
.help{text-align:left;font-size:13px;line-height:1.5}
.help b{color:var(--ac2)}
.help .now{background:rgba(111,227,255,.1);border:1px solid rgba(111,227,255,.4);border-radius:10px;padding:8px 10px;color:var(--cy);margin:8px 0}
/* ARBRE PLEIN ÉCRAN & VUE DU VAISSEAU */
#hub.full .sheet{position:absolute!important;left:0;right:0;top:0;bottom:0;height:100%!important;margin:0;border-radius:0;z-index:5}
#hub.full .hubtop,#hub.full #lumi{display:none}
#inv2{display:none;gap:5px;overflow-x:auto;padding:10px 10px 0;scrollbar-width:none}
#hub.full #inv2{display:flex}
#hub.shipv .sheet{height:38%}
#hub.shipv{pointer-events:none}
#hub.shipv .hubtop,#hub.shipv .sheet{pointer-events:auto}
#hub.shipv #lumi{display:none}
#hub.gatev{pointer-events:none}
#hub.gatev .hubtop,#hub.gatev .sheet{pointer-events:auto}
#hub #lumi{pointer-events:none}
#hub.tall #lumi{display:none}
#hub .sheet{position:relative;z-index:3}
#bFull{flex:0 0 auto!important;width:36px}
.tabs button[data-t]{flex:1 1 auto}
/* MODAL / INTRO */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal.show{display:flex}
.modal .card{max-width:400px;width:100%;border-color:var(--ac);text-align:center;max-height:90%;overflow:auto;background:var(--p2)}
.big{font-size:28px;font-weight:900;color:var(--ac2)}
.g2{display:grid;grid-template-columns:1fr auto;gap:5px 10px;text-align:left;margin-top:8px;font-size:13px}
#sub{position:absolute;left:16px;right:16px;bottom:calc(10px + env(safe-area-inset-bottom));min-height:64px;display:flex;flex-direction:column;justify-content:flex-end;text-align:center;font-size:16px;font-weight:600;line-height:1.4;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .35s}
#skip{position:absolute;right:14px;top:14px;padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);font-size:12px;font-weight:700}
.toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:var(--p2);border:1px solid var(--ac);padding:8px 13px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;z-index:40;pointer-events:none;text-align:center;max-width:90%}
.toast.show{opacity:1}
.node.tuto-focus,.node.tuto-focus *{opacity:1!important;filter:none!important}
.cos .sw::after{display:none!important}
body.inrun .toast{top:124px}
input[type=text],#nameIn{user-select:text;-webkit-user-select:text}
input[type=range]{width:100%;accent-color:var(--ac)}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;text-align:left}
.sw{width:46px;height:26px;border-radius:13px;background:var(--ln);position:relative}
.sw.on{background:var(--ok)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on::after{left:23px}
textarea{width:100%;min-height:56px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px;font:11px monospace;user-select:text}
#adov{position:absolute;inset:0;background:#000;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px}
#adov.show{display:flex}

/* ====== habillage v9 ====== */
.btn{background:linear-gradient(#ffd683,#ffa53a);box-shadow:0 3px 0 #b5701e,0 8px 18px rgba(255,150,50,.22);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b5701e}
.btn.s{background:linear-gradient(rgba(48,43,78,.96),rgba(27,24,46,.96));box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
.btn.g{box-shadow:0 3px 0 #23875e,0 8px 18px rgba(98,224,162,.22)}
.modal{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal.show .card{animation:popin .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{from{transform:scale(.86) translateY(12px);opacity:0}to{transform:none;opacity:1}}
.modal .card{background:linear-gradient(180deg,#28223f,#16132a);box-shadow:0 0 0 1px rgba(255,182,72,.4),0 22px 50px rgba(0,0,0,.65),0 0 46px rgba(255,160,60,.13)}
.o2 .bar{height:16px;box-shadow:inset 0 2px 4px rgba(0,0,0,.55),0 0 14px rgba(80,200,255,.22)}
.o2 .bar i{position:relative;box-shadow:0 0 12px rgba(120,230,255,.7)}
.o2 .bar i:after{content:'';position:absolute;left:3px;right:3px;top:2px;height:4px;border-radius:4px;background:rgba(255,255,255,.38)}
.o2 .bar.low{animation:o2p .45s infinite alternate}
@keyframes o2p{to{box-shadow:0 0 20px rgba(255,80,80,.9)}}
.chip{background:rgba(12,10,26,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.sheet{background:linear-gradient(180deg,#231f3b,#15122a);box-shadow:0 -8px 30px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}
.tabs button.on{background:linear-gradient(180deg,#332c56,#1e1a36);color:#fff;box-shadow:inset 0 -2px 0 var(--ac)}
.card{background:linear-gradient(180deg,#1c1932,#141126)}
#menu h1{animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,100%{filter:drop-shadow(0 4px 12px rgba(255,150,60,.35))}50%{filter:drop-shadow(0 4px 24px rgba(255,170,80,.75))}}
#pauseBtn{display:flex;align-items:center;justify-content:center;gap:4px}
#pauseBtn i{display:block;width:4px;height:14px;border-radius:2px;background:#fff}
#toolBadge,.iconbtn{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#bGal{background:radial-gradient(circle,#5a2fa0,#1d1a30);border-color:#c38bff;animation:galp 2.4s ease-in-out infinite}
@keyframes galp{0%,100%{box-shadow:0 0 0 rgba(195,139,255,0)}50%{box-shadow:0 0 14px rgba(195,139,255,.9)}}
#ptree{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;background:radial-gradient(120% 80% at 50% 0%,#2a1f10,#07060d 70%)}#ptree.show{display:flex}

.stabs{display:flex;gap:4px;margin-bottom:8px;position:sticky;top:-10px;z-index:2;background:linear-gradient(#1d1934,#1d1934e0);padding:4px 0}
.stabs button{flex:1;padding:8px 2px;border-radius:10px;background:rgba(255,255,255,.04);color:var(--mu);font-weight:800;font-size:12px}
.stabs button.on{background:linear-gradient(180deg,#3a2f66,#251f42);color:#fff;box-shadow:inset 0 -2px 0 var(--ac)}
.wallet{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:12px;background:rgba(255,210,63,.08);border:1px solid rgba(255,210,63,.25);margin-bottom:10px;font-size:14px}
.offer{position:relative;border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--ln);background:linear-gradient(135deg,#2a2348,#171328)}
.offer.hot{border-color:#ffb648;background:linear-gradient(135deg,#4a2a14,#1f1428);box-shadow:0 0 24px rgba(255,160,60,.25);cursor:pointer}
.offer.vip{border-color:rgba(255,210,63,.55);background:linear-gradient(135deg,#2e2610,#16131f)}
.offer.piggy{border-color:rgba(255,140,190,.45);background:linear-gradient(135deg,#3a1a2e,#171328)}
.offer.pass{border-color:rgba(195,139,255,.55);background:linear-gradient(135deg,#2b1d52,#171328)}
.otag{position:absolute;top:-9px;left:12px;background:linear-gradient(#ffd683,#ff9a3c);color:#2a1700;font-weight:900;font-size:11.5px;padding:3px 8px;border-radius:7px;letter-spacing:.5px}
.tagb{display:inline-block;background:#ff6fa8;color:#fff;font-size:11.5px;font-weight:900;padding:2px 6px;border-radius:6px;vertical-align:middle}
.tagb.x2{background:#62e0a2;color:#062016}
.pbar2{height:8px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0 3px}
.pbar2 i{display:block;height:100%;background:linear-gradient(90deg,#ff9ad0,#ffd23f);border-radius:5px}
.prow{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;align-items:stretch;margin-bottom:6px}
.prow.head{font-size:12px;color:var(--mu);font-weight:800;text-align:center}
.prow .pt{display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(255,255,255,.05);font-weight:900;color:var(--mu)}
.prow.reach .pt{background:linear-gradient(#8a5cff,#5a3aa8);color:#fff}
.pcell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--ln);font-size:12px;line-height:1.2}
.pcell.prem{background:linear-gradient(180deg,rgba(255,210,63,.09),rgba(255,210,63,.03));border-color:rgba(255,210,63,.3)}
.pcell.can{border-color:var(--ok);box-shadow:0 0 12px rgba(98,224,162,.3)}
.pcell.can b{color:var(--ok)}.pcell.got{opacity:.55}.pcell.lock{opacity:.6}
.cosg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cos{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;background:var(--p);border:2px solid var(--ln);font-size:12px}

// ---------- PALIERS : chaque compétence évolue 5 niveaux à la fois ; la suite se retrouve plus loin dans l'arbre ----------
const SEGN=5,SKRINGS=[];
(function(){const base=SK.slice(),all=base.slice();const rings=[];
  /* niveau de minerai demandé (0 roche … 6 plasmite) : la suite d'une compétence se place là où l'arbre demande le même minerai */
  const ORD=['roche','fer','cuivre','cristal','or','titane','plasmite','lingots'];
  const tierAt=(z,l)=>{let t=0;for(const c of z.c)if(l>=c.f&&l<c.t)t=Math.max(t,ORD.indexOf(c.r));return t;};
  const TR=[];for(let t=0;t<7;t++){const r=base.filter(z=>z.id!=='force'&&!z.tool&&tierAt(z,0)===t).map(z=>Math.hypot(z.x,z.y)).sort((x,y)=>x-y);TR[t]=r.length>1?r[Math.floor(r.length/2)]:0;}
  for(let t=0;t<7;t++)TR[t]=Math.max(TR[t],t?TR[t-1]+.6:2.4);
  for(const z of base){z.tier=tierAt(z,0);if(z.m<=SEGN||z.tool||z.scan)continue;z.segM=SEGN;const n=Math.ceil(z.m/SEGN);for(let k=1;k<n;k++)rings.push({b:z,k,t:tierAt(z,SEGN*k)});}
  const RN=['','II','III','IV','V','VI','VII'];
  rings.sort((x,y)=>x.k-y.k||x.t-y.t||Math.hypot(x.b.x,x.b.y)-Math.hypot(y.b.x,y.b.y));
  const free=(x,y)=>all.every(q=>Math.hypot(q.x-x,q.y-y)>=1.05);
  const byId={};all.forEach(q=>byId[q.id]=q);
  const dSeg=(px,py,ax,ay,bx,by)=>{const vx=bx-ax,vy=by-ay,L2=vx*vx+vy*vy||1;let t=((px-ax)*vx+(py-ay)*vy)/L2;t=Math.max(0,Math.min(1,t));return Math.hypot(ax+t*vx-px,ay+t*vy-py);};
  const cross=(a,b,c,d)=>{const o=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);return o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0;};
  const clear=(q,x,y)=>{const pt={x,y};for(const o of all){if(o===q)continue;if(dSeg(o.x,o.y,q.x,q.y,x,y)<.6)return false;}
    for(const o of all){if(!o.p)continue;const pp=byId[o.p];if(!pp||pp===q||o===q)continue;if(cross(q,pt,pp,o))return false;}return true;};
  for(const e of rings){const z=e.b,prev=e.k===1?z:all.find(q=>q.base===z.id&&q.seg===e.k-1);
    const r0=Math.hypot(prev.x,prev.y),a0=r0>.01?Math.atan2(prev.y,prev.x):-Math.PI/2+.3;
    const R=Math.min(Math.max(TR[e.t],r0+1.1),r0+3.2),ix=Math.cos(a0)*R,iy=Math.sin(a0)*R;
    const cands=[];for(let dx=-4;dx<=4;dx+=.2)for(let dy=-4;dy<=4;dy+=.2){const x=ix+dx,y=iy+dy;if(Math.hypot(x,y)<r0+.9)continue;cands.push([Math.hypot(dx,dy),x,y]);}
    cands.sort((u,v)=>u[0]-v[0]);let bx=ix,by=iy,par=prev;
    for(const[d,x,y]of cands){if(!free(x,y))continue;let pq=null;
      if(Math.hypot(prev.x-x,prev.y-y)<=3.4&&clear(prev,x,y))pq=prev;
      else{let pd=3;for(const q of all){if(q.base===z.id||q.id===z.id)continue;if((q.tier||0)>e.t)continue;if(Math.hypot(q.x,q.y)>Math.hypot(x,y)-.4)continue;const dd=Math.hypot(q.x-x,q.y-y);if(dd<pd&&clear(q,x,y)){pd=dd;pq=q;}}}
      if(pq){bx=x;by=y;par=pq;break;}}
    all.push({id:z.id+'__'+(e.k+1),base:z.id,seg:e.k,tier:e.t,i:z.i,rn:RN[e.k],n:z.n+' '+RN[e.k],p:par.id,x:+bx.toFixed(2),y:+by.toFixed(2),m:Math.min(SEGN,z.m-SEGN*e.k),c:z.c,d:z.d,req:1});byId[all[all.length-1].id]=all[all.length-1];}
  SK.length=0;all.forEach(z=>SK.push(z));})();
function nodeLvl(z){if(typeof z==='string')z=SKM[z];if(!z)return 0;const b=L(z.base||z.id);if(z.base)return clamp(b-SEGN*z.seg,0,z.m);return z.segM?Math.min(b,z.segM):b;}
function nodeMax(z){return z.base?z.m:(z.segM||z.m);}
function nextSeg(z){const b=z.base||z.id,k=z.base?z.seg+1:1;return SK.find(q=>q.base===b&&q.seg===k);}
function prevSeg(z){if(!z.base)return null;return z.seg===1?SKM[z.base]:SK.find(q=>q.base===z.base&&q.seg===z.seg-1);}

const AU={ctx:null,master:null,sfx:null,mus:null,rev:null,musicOn:false,nextBar:0,bar:0,
 init(){if(this.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();}catch(e){return;}
  const c=this.ctx;this.master=c.createGain();this.master.connect(c.destination);
  this.sfx=c.createGain();this.sfx.connect(this.master);this.mus=c.createGain();this.mus.connect(this.master);
  // écho spatial
  const d=c.createDelay(1);d.delayTime.value=.42;const fb=c.createGain();fb.gain.value=.38;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;
  d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(this.mus);this.rev=d;
  this.vol();setInterval(()=>this.sched(),200);},
 vol(){if(!this.ctx)return;this.sfx.gain.value=META.set.sfx;this.mus.gain.value=META.set.music*.5;},
 resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
 tone(f,dur,type,vol,slide,dest,at){if(!this.ctx)return;const c=this.ctx,t=at||c.currentTime;const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest||this.sfx);o.start(t);o.stop(t+dur+.05);},
 noise(dur,vol,freq,type,dest){if(!this.ctx)return;const c=this.ctx,t=c.currentTime;const n=Math.floor(c.sampleRate*dur);const b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq||1200;const g=c.createGain();g.gain.value=vol||.3;s.connect(f);f.connect(g);g.connect(dest||this.sfx);s.start();},
 hit(ore){const p=ORES[ore].pitch;this.noise(.07,.35,2600,'bandpass');this.tone(p*2,.12,'triangle',.12);this.tone(p*3.01,.09,'sine',.06);},
 brk(ore){const p=ORES[ore].pitch;this.noise(.35,.45,500);this.tone(110,.25,'sine',.3,45);if(ORES[ore].glow)[1,1.25,1.5,2].forEach((m,i)=>this.tone(p*m,.25,'triangle',.08,0,null,this.ctx&&this.ctx.currentTime+i*.05));},
 step(){this.noise(.05,.08,400);},
 loot(){if(!this.ctx)return;[523,659,784,1047].forEach((f,i)=>this.tone(f,.3,'triangle',.12,0,null,this.ctx.currentTime+i*.07));},
 click(){this.tone(660,.06,'triangle',.08);},
 buy(){if(!this.ctx)return;[392,523,659].forEach((f,i)=>this.tone(f,.22,'square',.05,0,null,this.ctx.currentTime+i*.06));},
 alarm(){this.tone(880,.12,'square',.07);},
 zap(){if(!this.ctx)return;this.noise(.25,.35,4000,'highpass');this.tone(1800,.15,'sawtooth',.05,200);},
 boom(){this.noise(1.4,.6,300);this.tone(70,1,'sine',.5,30);},
 // musique d'ambiance spatiale : nappes + arpèges pentatoniques, générées à l'infini
 startMusic(){this.musicOn=true;if(this.ctx&&!this.nextBar)this.nextBar=this.ctx.currentTime+.2;},
 sched(){if(!this.ctx||!this.musicOn||META.set.music<=0)return;const c=this.ctx;
  while(this.nextBar<c.currentTime+1.5){
   const chords=[[57,64,69,72],[53,60,65,69],[48,55,60,64],[55,62,67,71]];const ch=chords[this.bar%4];const t=this.nextBar,len=8;
   ch.forEach((m,i)=>{const f=440*Math.pow(2,(m-69)/12);[0,4].forEach(dt=>{const o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();o.type='sawtooth';o.frequency.value=f*(1+(dt?.003:-.003));lp.type='lowpass';lp.frequency.value=700;
     g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.025,t+2.5);g.gain.linearRampToValueAtTime(.018,t+len-1);g.gain.linearRampToValueAtTime(0,t+len+1.5);o.connect(lp);lp.connect(g);g.connect(this.mus);o.start(t);o.stop(t+len+2);});});
   // basse
   this.tone(440*Math.pow(2,(ch[0]-24-69)/12),len,'sine',.09,0,this.mus,t);
   // arpège
   const scale=[69,72,74,76,79,81,84];
   for(let k=0;k<16;k++){if(Math.random()<.42){const m=scale[Math.floor(Math.random()*scale.length)];const f=440*Math.pow(2,(m-69)/12);const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;const tt=t+k*.5;
     g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.035,tt+.01);g.gain.exponentialRampToValueAtTime(.0001,tt+.9);o.connect(g);g.connect(this.mus);g.connect(this.rev);o.start(tt);o.stop(tt+1);}}
   this.nextBar+=len;this.bar++;}}
};

function obstCircles(){const c=[{x:SHIP.x,y:SHIP.y,r:2.1}];if(WORLD&&!L('antigrav'))for(const p of WORLD.pools)c.push({x:p.x,y:p.y,r:p.r*.8});return c;}
let STEER_SIDE=0;
function steerDir(px,py,tx,ty){let dx=tx-px,dy=ty-py;const D=Math.hypot(dx,dy)||1;dx/=D;dy/=D;
  let best=null;for(const c of obstCircles()){const R=c.r+.32,vx=px-c.x,vy=py-c.y,dist=Math.hypot(vx,vy);
    if(Math.hypot(tx-c.x,ty-c.y)<R)continue;                       // la cible est collée à l'obstacle : on la laisse gérer
    const t=-(vx*dx+vy*dy);if(t<0&&dist>R+.05)continue;             // obstacle derrière nous
    const cxp=vx+dx*Math.min(Math.max(t,0),D),cyp=vy+dy*Math.min(Math.max(t,0),D);if(Math.hypot(cxp,cyp)>=R)continue; // le trajet ne le touche pas
    if(!best||dist<best.dist)best={c,R,vx,vy,dist};}
  if(!best){STEER_SIDE=0;return[dx,dy];}
  const {R,vx,vy,dist}=best,ux=vx/dist,uy=vy/dist,cxo=best.c.x,cyo=best.c.y;
  if(dist<=R+.08){if(!STEER_SIDE)STEER_SIDE=((-uy*dx+ux*dy)>=0)?1:-1;const ax=-uy*STEER_SIDE,ay=ux*STEER_SIDE;
    const push=Math.max(0,R+.05-dist)*3,ox=ax+ux*push,oy=ay+uy*push,l=Math.hypot(ox,oy)||1;return[ox/l,oy/l];}
  const a=Math.acos(Math.min(1,R/dist));let bq=null;
  for(const sg of [1,-1]){const ca=Math.cos(a*sg),sa=Math.sin(a*sg),qx=cxo+(ux*ca-uy*sa)*R,qy=cyo+(ux*sa+uy*ca)*R,cost=Math.hypot(qx-px,qy-py)+Math.hypot(tx-qx,ty-qy);if(!bq||cost<bq.cost)bq={qx,qy,cost};}
  let ox=bq.qx-px,oy=bq.qy-py;const l=Math.hypot(ox,oy)||1;return[ox/l,oy/l];}

function drawGarden(t,tt){

  cx.fillStyle='#3a2a1a';cx.fillRect(W*.15,H*.5,8,H*.2);cx.fillStyle='#2f6a3a';cx.beginPath();cx.arc(W*.15+4,H*.48,34,0,7);cx.fill();

  if(tt>5){for(let i=0;i<6;i++){const a=t*1.5+i;cx.fillStyle='rgba(255,120,150,'+(.6-((tt-5+i*.3)%2)/3.4)+')';cx.font='18px system-ui';cx.fillText('❤',W*.4+Math.cos(a)*40,H*.66-((tt-5+i*.3)%2)*40);}}

const SEASON0=Date.UTC(2026,10,1),PASS_T=30,PASS_XP=100,PIGGY_CAP=600;
function seasonId(){return Math.floor((Date.now()-SEASON0)/(30*DAY));}
function seasonLeft(){return SEASON0+(seasonId()+1)*30*DAY-Date.now();}
function durTxt(ms){ms=Math.max(0,ms);if(ms<60000)return Math.max(1,Math.ceil(ms/1000))+' s';const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/36e5),m=Math.floor(ms%36e5/6e4);return d>0?d+' j '+h+' h':h>0?h+' h '+m+' min':m+' min';}
function ensureEco(){const M=META;if(!M.pass||M.pass.s!==seasonId())M.pass={s:seasonId(),xp:0,prem:false,cf:[],cp:[]};M.piggy=M.piggy||0;M.vip=M.vip||0;M.starter=M.starter||{seen:0,until:0,bought:false};M.fb=M.fb||{};M.trails=M.trails||['none'];M.trail=M.trail||'none';M.lumis=M.lumis||['cyan'];M.lumiC=M.lumiC||'cyan';if(!M.dshop||M.dshop.d!==dkey(new Date()))M.dshop={d:dkey(new Date()),b:[]};M.vipDay=M.vipDay||'';M.adChest=M.adChest||'';}
function resetPass(){const pr=!!(META.pass&&META.pass.prem&&META.pass.s===seasonId());META.pass={s:seasonId(),xp:0,prem:pr,cf:[],cp:[]};}

const LUMIS=[{id:'cyan',n:_t('Cyan'),c:'111,227,255',price:0},{id:'rose',n:_t('Rose'),c:'255,111,190',price:250},{id:'violet',n:_t('Violet'),c:'195,139,255',price:400},{id:'rouge',n:_t('Rubis'),c:'255,90,90',price:500},{id:'vert',n:_t('Émeraude'),c:'98,224,162',price:-3},{id:'or',n:_t('Doré'),c:'255,210,63',price:-3}];
function LC(){const l=LUMIS.find(z=>z.id===META.lumiC);return l?l.c:'111,227,255';}
function trailCol(){const tr=TRAILS.find(z=>z.id===META.trail)||TRAILS[0];return tr.c[Math.floor(Math.random()*tr.c.length)];}
function passTier(){return Math.min(PASS_T,Math.floor(META.pass.xp/PASS_XP));}
function passAdd(x){ensureEco();const b=passTier();META.pass.xp+=x*(isVIP()?1.25:1);const a=passTier();if(a>b)toast(_t('🎫 Passe Stellaire : palier ')+a+_t(' atteint ! Récompense dans la boutique.'));}
function passReward(t,prem){
  if(!prem){if(t===10)return{k:'skin',v:'corail',n:_t('Tenue Corail'),ic:'🧑‍🚀'};if(t===20)return{k:'trail',v:'glace',n:_t('Effet Givre'),ic:'✨'};if(t===30)return{k:'lumi',v:'vert',n:_t('LUMI émeraude'),ic:'🤖'};
    const c=t%4;return c===0?{k:'lingots',v:1,n:_t('1 lingot'),ic:'🧱'}:c===1?{k:'stars',v:8,n:'8 ⭐',ic:'⭐'}:c===2?{k:'bomb',v:2,n:'2 bombes',ic:'💣'}:{k:'caps',v:1,n:_t('1 capsule d’O₂'),ic:'🧯'};}
  if(t===1)return{k:'skin',v:'galaxie',n:_t('Tenue Galaxie'),ic:'🧑‍🚀'};if(t===15)return{k:'trail',v:'arc',n:_t('Effet Arc-en-ciel'),ic:'🌈'};if(t===25)return{k:'lumi',v:'or',n:_t('LUMI doré'),ic:'🤖'};if(t===30)return{k:'skin',v:'nebuleuse',n:_t('Tenue Nébuleuse'),ic:'🧑‍🚀'};
  if(t%5===0)return{k:'noyaux',v:1,n:_t('1 noyau stellaire'),ic:'⚛️'};const c=t%3;return c===0?{k:'stars',v:25,n:'25 ⭐',ic:'⭐'}:c===1?{k:'boost',v:20,n:_t('Butin ×2 · 20 min'),ic:'⚡'}:{k:'lingots',v:3,n:_t('3 lingots'),ic:'🧱'};}
function giveReward(r){S.items=S.items||{};

  else if(r.k==='boost')S.boost=Math.max(Date.now(),S.boost||0)+r.v*6e4;else if(r.k==='skin'){if(!META.skins.includes(r.v))META.skins.push(r.v);}else if(r.k==='trail'){if(!META.trails.includes(r.v))META.trails.push(r.v);}else if(r.k==='lumi'){if(!META.lumis.includes(r.v))META.lumis.push(r.v);}}

function dailyOffers(){const d=dkey(new Date());const r=rng(d.split('').reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7));const pool=[...DPOOL],out=[];while(out.length<3&&pool.length)out.push(pool.splice(Math.floor(r()*pool.length),1)[0]);

    ...TRAILS.filter(z=>z.price>0&&!META.trails.includes(z.id)).map(z=>({id:'tr_'+z.id,n:_t('Effet ')+z.n,ic:'✨',p:Math.round(z.price*.7),old:z.price,give:()=>{META.trails.push(z.id);META.trail=z.id;}})),
    ...LUMIS.filter(z=>z.price>0&&!META.lumis.includes(z.id)).map(z=>({id:'lu_'+z.id,n:'LUMI '+z.n,ic:'🤖',p:Math.round(z.price*.7),old:z.price,give:()=>{META.lumis.push(z.id);META.lumiC=z.id;}}))];
  if(cos.length)out.unshift(cos[Math.floor(r()*cos.length)]);return out;}

function catchUp(){
  if(!S||S.runs<1)return;const now=Date.now(),sec=(now-(S.last||now))/1000;S.last=now;
  if(sec<90)return;
  const rep=[];{const l0=S.inv.lingots||0;fondTick();const dl=(S.inv.lingots||0)-l0;if(dl>0)rep.push('🧱 '+_t('Fonderie :')+' +'+dl+' '+_t('lingots'));}
  {LAB_SINK=[];try{labTick();}finally{const ls=LAB_SINK;LAB_SINK=null;if(ls.length)rep.push('🔬 '+_t('Laboratoire :')+' '+ls.length+' '+_t('analyse(s) terminée(s)')+'<br><small>'+ls.join('<br>')+'</small>');}}
  {const ex=Object.keys(S.crewMis||{}).filter(id=>S.crewMis[id].end<=now);if(ex.length)rep.push('🧭 '+ex.map(id=>CREW[id]?CREW[id].n:id).join(', ')+' '+_t('de retour d’expédition (Cabine)'));}
  {let og=0;for(const pl in (S.outp||{}))og+=outGain(+pl);if(og>0)rep.push('🏗️ '+_t('Avant-postes :')+' '+fmt(og)+' '+_t('minerais prêts (Carte galactique)'));}
  const min=Math.min(sec/60,480+120*L('batt')),rate=offRate(L('foreuse'))*(META.pioneer?2:1)*(isVIP()?1.5:1)*(1+.3*RM('quartiers'));
  const types=unlockedOres().slice(0,1+L('foreuse2'));const got={};
  types.forEach((t,i)=>{const q=Math.floor(min*rate*(i?.3:1));if(q>0){got[t]=q;S.inv[t]=(S.inv[t]||0)+q;}});
  const dg=droneTick();if(dg)for(const t in dg)got[t]=(got[t]||0)+dg[t];
  if(!Object.keys(got).length&&!rep.length)return;save();
  const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
  const fresh0=!WELC;WELC=WELC||{dbl:[]};
  WELC.abs=_t('<p class="mu">Absent ')+(h?h+' h '+m+' min':m+' min')+(sec/60>480+120*L('batt')?' ('+(8+2*L('batt'))+' h max)':'')+_t('. La foreuse du vaisseau a continué d’extraire :</p><div class="g2">')+Object.keys(got).map(r=>'<span>'+gemHTML(r)+ORES[r].n+'</span><b>+'+fmt(got[r])+'</b>').join('')+'</div>'+(rep.length?'<div class="card" style="text-align:left;margin-top:8px">'+rep.join('<br>')+'</div>':'')+(()=>{try{const g=goalNow();return g&&g.t?'<p class="mu" style="margin-top:8px">'+_t('🎯 Prochain objectif : ')+g.t+'</p>':'';}catch(e){return '';}})();
  WELC.dbl.push(()=>{for(const r in got)S.inv[r]+=got[r];});
  if(fresh0)enqueue(welcomeShow);
  renderHub();
}

 {id:'m5',title:_t('Sept bougies'),from:_t('Toute la famille'),kind:'video',scene:'birthday',when:()=>S.story.video,lines:[

 {id:'m6',title:_t('L’arbre de Papa'),from:'Evelyne',kind:'audio',when:()=>S.planet>=2&&pc()>=2,lines:[

 {id:'m11',title:_t('La recette du dimanche'),from:'Evelyne',kind:'audio',when:()=>S.planet>=1&&S.runs>=35,lines:[

// LUMI : bulles de dialogue
let lumiTimer=null;
let lumiLast=0;
function lumiSay(txt,dur){lumiLast=Date.now();const e=$('lumi');if(!e)return;$('lumiTxt').textContent=txt;e.classList.add('show');clearTimeout(lumiTimer);lumiTimer=setTimeout(()=>e.classList.remove('show'),dur||6500);lumi.say=1.5;}
function idleLine(){
  const l=[_t('Ma batterie est à 100 %. Mon optimisme aussi.'),_t('Respirez calmement dehors, Capitaine. Chaque seconde d’oxygène compte.'),
   _t('La Terre est à ')+(PLANETS.length-S.planet)+' '+plw(PLANETS.length-S.planet,'saut')+_t(' d’ici. On y arrive.'),_t('Plus on s’éloigne du vaisseau, plus les minerais sont rares… et précieux.'),
   _t('Je n’ai pas de cœur, Capitaine. Mais si j’en avais un, il battrait pour votre famille.'),_t('J’ai rangé vos outils. Enfin… je les ai regardés très fort.')];
  if(!S.story.radio)l.push(_t('Si on répare la radio de bord, on pourra peut-être capter la Terre…'),_t('La radio ne coûte que 20 roches. Je dis ça, je dis rien.'));
  if(S.story.drawing)l.push(_t('Le dessin d’Imany est toujours au-dessus de votre couchette. Je le regarde souvent.'));
  if(S.story.seen.includes('m3'))l.push(_t('Lehyss doit en être à des centaines d’étoiles comptées, maintenant.'));
  l.push(_t('Courage, Capitaine ')+HERO()+_t('. Chaque rocher nous rapproche d’')+SPOUSE()+_t(' et des enfants.'));
  if(WORLD&&WORLD.wreck&&!S.story.wrecks[S.planet])l.push(_t('Mes capteurs détectent une épave quelque part sur cette planète. Un autre naufragé…'));
  if(affordable())l.push(_t('Vous avez de quoi améliorer votre équipement. Jetez un œil à l’arbre !'));
  if(S.story.frags>0&&S.story.frags<4)l.push(_t('Encore ')+(4-S.story.frags)+' '+plw(4-S.story.frags,'fragment')+_t(' et la photo de famille sera complète.'));
  return l[Math.floor(Math.random()*l.length)];
}
function lumiIdle(first){if(first)setTimeout(()=>{if(mode==='hub'&&!$('modal').classList.contains('show')&&Date.now()-lumiLast>6000)lumiSay(idleLine());},1600);}
setInterval(()=>{if(S&&mode==='hub'&&!$('modal').classList.contains('show')&&Date.now()-lumiLast>12000)lumiSay(Math.random()<.5?adviceNow():idleLine());},30000);
// transmissions
let txQueued=null,txAnim=null,txTimer=null;
function checkStory(){if(!S)return;const m=MSGS.find(z=>!S.story.seen.includes(z.id)&&z.when());if(!m||txQueued===m.id)return;txQueued=m.id;
  enqueue(()=>{txQueued=null;AU.alarm();vib([60,60,60]);modal('<div style="font-size:42px">📡</div><div class="nm" style="font-size:17px">'+(m.kind==='video'?_t('Vidéo entrante'):_t('Transmission entrante'))+'</div><p class="mu">'+(m.kind==='static'?_t('Signal très faible…'):_t('De : ')+fill(m.from))+'</p>',[[_t('Écouter'),()=>openTx(m)]]);});}
function openTx(m,replay){
  setMode('tx');AU.init();AU.noise(1.2,.22,3000,'highpass');
  $('txhead').textContent=m.kind==='video'?_t('📺 VIDÉO ENTRANTE'):m.kind==='static'?_t('📡 SIGNAL BROUILLÉ'):_t('📻 TRANSMISSION AUDIO');
  $('txfrom').textContent=m.kind==='static'?_t('Expéditeur inconnu'):_t('De : ')+fill(m.from);$('txtext').innerHTML='';$('txbtns').innerHTML='';
  const c=$('txc');const r=c.getBoundingClientRect();c.width=r.width*DPR;c.height=r.height*DPR;txAnim={m};
  let i=0;const next=()=>{if(i<m.lines.length){const p=document.createElement('p');p.textContent=fill(m.lines[i]);$('txtext').appendChild(p);$('txtext').scrollTop=1e5;AU.tone(880,.04,'square',.03);i++;txTimer=setTimeout(next,replay?600:Math.min(4400,1200+m.lines[i-1].length*30));}else done();};
  $('txtext').onclick=()=>{if(i<m.lines.length){clearTimeout(txTimer);next();}};
  const close=()=>{AU.click();txAnim=null;$('txtext').onclick=null;if(!replay&&!S.story.seen.includes(m.id))S.story.seen.push(m.id);save();setMode('hub');if(replay){tab='cab';renderHub();}};
  function done(){
    if(replay){const e=document.createElement('button');e.className='btn';e.textContent=_t('Fermer');e.onclick=close;$('txbtns').appendChild(e);return;}
    m.replies.forEach((rp,k)=>{const b=document.createElement('button');b.className=_t('btn s');b.textContent='💬 « '+fill(rp)+' »';b.onclick=()=>{AU.click();S.story.rep[m.id]=k;$('txbtns').innerHTML='';
      const p=document.createElement('p');p.innerHTML='<i>'+esc(HERO())+' : « '+esc(fill(rp))+' »</i>';$('txtext').appendChild(p);AU.tone(523,.2,'triangle',.08);
      if(m.kind!=='static'){const ok=document.createElement('p');ok.className='mu';ok.textContent=_t('✓ Message envoyé vers la Terre');$('txtext').appendChild(ok);}
      if(m.reward)m.reward();
      if(m.lumi)setTimeout(()=>{const q=document.createElement('p');q.className='lumi';q.textContent='🤖 LUMI : « '+fill(m.lumi)+' »';$('txtext').appendChild(q);$('txtext').scrollTop=1e5;lumi.say=2;},800);
      setTimeout(()=>{const e=document.createElement('button');e.className='btn';e.textContent=_t('Fermer la transmission');e.onclick=close;$('txbtns').appendChild(e);$('txtext').scrollTop=1e5;},1500);};
      $('txbtns').appendChild(b);});}
  next();
}
// dessins : personnages, portraits, scènes vidéo
function drawPerson(x,y,h,P,wave){const s=h*46;wave=wave||0;cx.save();cx.translate(x,y);
  cx.fillStyle='rgba(0,0,0,.25)';cx.beginPath();cx.ellipse(0,0,s*.22,s*.06,0,0,7);cx.fill();
  cx.fillStyle='#2b2f45';cx.fillRect(-s*.12,-s*.38,s*.1,s*.38+wave*2);cx.fillRect(s*.02,-s*.38,s*.1,s*.38-wave*2);
  cx.fillStyle=P.c;cx.beginPath();cx.moveTo(-s*.2,-s*.36);cx.lineTo(s*.2,-s*.36);cx.lineTo(s*.16,-s*.78);cx.lineTo(-s*.16,-s*.78);cx.closePath();cx.fill();
  cx.strokeStyle=P.c;cx.lineWidth=s*.07;cx.lineCap='round';cx.beginPath();cx.moveTo(-s*.15,-s*.72);cx.lineTo(-s*.26,-s*.45+wave*3);cx.moveTo(s*.15,-s*.72);cx.lineTo(s*.26,-s*.45-wave*3);cx.stroke();
  cx.fillStyle=P.skin;cx.beginPath();cx.arc(0,-s*.9,s*.14,0,7);cx.fill();
  cx.fillStyle=P.hair;cx.beginPath();cx.arc(0,-s*.93,s*.15,Math.PI,0);cx.fill();if(P.beard){cx.beginPath();cx.arc(0,-s*.86,s*.11,.15*Math.PI,.85*Math.PI);cx.fill();}if(P.long){cx.fillRect(-s*.15,-s*.93,s*.06,s*.22);cx.fillRect(s*.09,-s*.93,s*.06,s*.22);}
  cx.restore();}
const PFI={};function pfImg(k){if(!PFI[k]){const i=new Image();i.src='real/pf_'+k+'.webp';PFI[k]=i;}const i=PFI[k];return i.complete&&i.naturalWidth?i:null;}
['izya','lehyss','hero','evelyne','heroine','mari'].forEach(pfImg);
function pfKey(P){const f=typeof FEM==='function'&&FEM();return P===PEOPLE.Hero?(f?'heroine':'hero'):P===PEOPLE.Evelyne?(f?'mari':'evelyne'):P===PEOPLE.Izya?'izya':P===PEOPLE.Lehyss?'lehyss':null;}
function drawPortrait(x,y,r,P){{const k=P&&pfKey(P),im=k&&pfImg(k);if(im){cx.save();cx.beginPath();cx.arc(x,y,r,0,7);cx.clip();cx.drawImage(im,x-r,y-r,2*r,2*r);cx.restore();cx.strokeStyle=P.c;cx.lineWidth=3;cx.beginPath();cx.arc(x,y,r,0,7);cx.stroke();return;}}cx.save();cx.beginPath();cx.arc(x,y,r,0,7);cx.clip();cx.fillStyle='#14203a';cx.fillRect(x-r,y-r,2*r,2*r);

function recommend(){const nodeFor=id=>SK.find(n=>(n.base||n.id)===id&&skAvail(n)&&nodeLvl(n)<nodeMax(n));
  let best=null,bs=1e9;PRIO.forEach((id,i)=>{const n=nodeFor(id);if(!n||!canPay(skCost(n)))return;const sc=i+L(id)*1.6;if(sc<bs){bs=sc;best=n.id;}});
  if(best)return best;for(const id of PRIO){const n=nodeFor(id);if(n)return n.id;}return null;}

function newContract(){const types=unlockedOres();const opts=[];
  types.forEach(t=>opts.push({k:'break',t,n:Math.max(4,Math.round([30,20,12,6][tierOf(t)]))}));
  opts.push({k:'run',n:Math.max(12,Math.ceil((S.stats.best||10)*1.15))});
  opts.push({k:'loot',n:3+S.planet});
  if(L('crit'))opts.push({k:'crit',n:15+5*S.planet});
  {const left=(WORLD&&WORLD.pois||[]).filter(p=>p.t!=='passage'&&!poiDone(p)&&poiVisible(p)).length;if(left)opts.push({k:'poi',n:Math.min(2,left)});}
  if(S.runs>=3)opts.push({k:'mon',n:3+S.planet});
  const used=S.contracts.map(c=>c.k+(c.t||''));const free=opts.filter(o=>!used.includes(o.k+(o.t||'')));const c=(free.length?free:opts)[Math.floor(Math.random()*(free.length||opts.length))];
  c.p=0;c.stars=2+Math.floor(Math.random()*3);c.rt=types[0];c.rq=Math.round(20*(1+S.planet)*(1+Math.random()));return c;}
function ensureContracts(){if(!S||!S.contracts)return;while(S.contracts.length<3)S.contracts.push(newContract());}
function cDesc(c){return c.k==='break'?_t('Casse ')+c.n+_t(' blocs de ')+ORES[c.t].n:c.k==='run'?_t('Récolte ')+c.n+_t(' ressources en une seule sortie'):c.k==='loot'?_t('Trouve ')+c.n+_t(' objets dans les rochers'):c.k==='poi'?_t('Explore ')+c.n+_t(' lieu(x) mystérieux sur cette planète'):c.k==='mon'?_t('Repousse ')+c.n+_t(' créatures'):_t('Réussis ')+c.n+_t(' coups critiques');}

let IV={tw:44,th:22,ox:0,oy:0};
function isoS(u,v,z){return[IV.ox+(u-v)*IV.tw/2,IV.oy+(u+v)*IV.th/2-(z||0)];}
function ipoly(pts,f,st,lw){poly(pts.map(p=>isoS(p[0],p[1],p[2])),f,st,lw);}
function ibox(u,v,w,d,h,col,z0){z0=z0||0;const c=h2r(col);const k=IV.tw/44;h*=k;z0*=k;

function eqInit(){if(!S)return;S.eq=S.eq||{};S.eqInv=S.eqInv||{};if(!S.eq.sac){let r=0;if(S.gear&&S.gear.bag){r=Math.min(3,S.gear.bag);delete S.gear.bag;}S.eq.sac={r};}

function ITR(t){return S&&S.eq&&S.eq[t]?S.eq[t].r:-1;}
function ILV(t){return S&&S.eq&&S.eq[t]?(S.eq[t].lv||0):0;}
function SACB(){return (S&&S.eq&&S.eq.sac&&S.eq.sac.base)||0;}
function ITV(t,r,lv){const v=ITYPES[t].v;if(r<0)return null;if(t==='sac')return 1+r+.5*(SACB()+(lv||0));const step=r<5?(v[r+1]-v[r]):(v[5]-v[4]);return v[r]+step*(lv||0)/4;}
function ITM(k){if(!S||!S.eq)return k==='crit'||k==='casque'||k==='luck'?0:1;
  if(k==='crit'){let c=0;const f=ITR('foret');if(f>=3)c+=.05;if(f>=5)c+=.05;if(ITR('talisman')>=3)c+=.03;return c;}
  if(k==='luck'){const r=ITR('talisman');return r>=0?ITV('talisman',r,ILV('talisman')):0;}
  const r=ITR(k);if(r<0)return k==='casque'?0:1;return ITV(k,r,ILV(k));}

function giveItem(t,r){eqInit();r=Math.max(0,Math.min(5,r));const k=t+':'+r;S.eqInv[k]=(S.eqInv[k]||0)+1;if(!S.eq[t]||S.eq[t].r<r){const kb=t==='sac'&&S.eq[t]?(S.eq[t].base||0)+(S.eq[t].lv||0):0;S.eq[t]={r,lv:0};if(kb)S.eq[t].base=kb;}

function enhCost(r,lv){const A=['roche','fer','cuivre','cristal','cristal','cristal'][r],B=['fer','cuivre','cristal','cuivre','cuivre','cuivre'][r];const m=(r+1)*(lv+1)*(1+.6*r);const o={};const add=(k,q)=>{k=mapRes(k);o[k]=(o[k]||0)+Math.round(q);};add(A,60*m);add(B,25*m);return o;}

  if(!run.lost&&Math.random()<.3){const id=giveCard(run.card||null);run.loot.push('🃏 '+_t('Carte : ')+_t(CARDS.find(c=>c.id===id).n));}
  if(SEV().id==='comete'){META.stars+=1;run.stars+=1;}
  if(run.deep){const f=run.deep;if(f>(S.deepBest||0)){let st=0;for(let k=(S.deepBest||0)+1;k<=f;k++)st+=k%5===0?25:5;META.stars+=st;run.loot.push('🏆 '+_t('Nouveau record du puits : étage ')+f+' · ⭐ +'+st);S.deepBest=f;if(f>=10&&!(META.album||[]).some(a=>a.i==='⛏️'))albumAdd('⛏️',_t('Étage 10 du puits profond'));}}
  CURWX=null;}

// ---------- accès boutique & notifications ----------
function openAccel(){tab='shop';shopTab='offres';full=false;$('modal').classList.remove('show');renderHub();setTimeout(()=>{const a=document.querySelector('#shop .starsg');if(a)a.scrollIntoView({behavior:'smooth'});},150);}
function nudge(key,html){META.nudge=META.nudge||{};const d=dkey(new Date());if(META.nudge[key]===d)return;META.nudge[key]=d;save();
  enqueue(()=>modal('<div style="display:flex;gap:10px;align-items:center;text-align:left"><div style="font-size:34px">🤖</div><div>'+html+'</div></div>',[[_t('🛒 Voir les accélérateurs'),openAccel],[_t('Plus tard'),null,'s']]));}
function notify(title,body){try{if(!META.set.notif||!('Notification' in window)||Notification.permission!=='granted')return;if(!document.hidden)return;
  if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'icon-192.png',tag:title})).catch(()=>{new Notification(title,{body});});else new Notification(title,{body});}catch(e){}}
function wipeAll(){modal('<div style="font-size:40px">🗑️</div><div class="nm" style="font-size:17px">'+_t('Effacer toutes mes données ?')+'</div><p class="mu">'+_t('Ta progression, tes étoiles, tes tenues et tes réglages seront supprimés de cet appareil. Les achats Google Play restent liés à ton compte Google et pourront être restaurés.')+'</p>',[[_t('Annuler'),null,'s'],[_t('Tout effacer'),()=>{try{localStorage.clear();}catch(e){}location.reload();},'']]);}
function askNotif(){try{if(!('Notification' in window)){toast(_t('Notifications non disponibles sur cet appareil'));return;}Notification.requestPermission().then(p=>{META.set.notif=p==='granted';save();toast(p==='granted'?_t('🔔 Notifications activées'):_t('Notifications refusées'));openSettings();});}catch(e){}}
let NOTI_LAST={};
setInterval(()=>{if(!S||!META.set.notif)return;const now=Date.now();
  const chk=(k,cond,t,b)=>{if(cond&&!NOTI_LAST[k]){NOTI_LAST[k]=1;notify(t,b);}if(!cond)NOTI_LAST[k]=0;};
  chk('lab',S.lab&&S.lab.end<=now,_t('🔬 Analyse terminée'),_t('LUMI a fini l’analyse au Laboratoire.'));
  chk('fond',S.fond&&S.fond.q>0&&S.fond.end<=now,_t('🧱 Lingot prêt'),_t('La Fonderie a fondu un nouveau lingot.'));
  chk('exp',Object.values(S.crewMis||{}).some(m=>m.end<=now),_t('🧭 Retour d’expédition'),_t('Un équipier est rentré avec du butin.'));
  chk('flash'+dkey(new Date()),!!META.set.notifShop,_t('🛍️ Nouvelle offre du moment'),_t('Une nouvelle offre est disponible dans la boutique.'));},60000);

// ---------- A. aide sur ce qui manque (en rouge) ----------
function goRoom(id){$('modal').classList.remove('show');tab='ship';selRoom=id;full=false;renderHub();setTimeout(()=>{const e=$('ship');if(e)e.scrollTop=0;},50);}
function goTree(id){$('modal').classList.remove('show');tab='tree';full=true;selSk=id||null;treeCentered=false;renderHub();}
function scanFor(o){const i=PLANETS[HOMEP()].ores.indexOf(o);return i>0?SK.find(s=>s.scan===i):null;}
function needHelp(r,q){AU.click();const steps=[],btn=[];const st=(ok,t)=>steps.push([ok,t]);let ic='❓',name=rName(r);
  if(r==='lingots'){ic='🧱';const o=fondOre(),built=RM('fonderie')>=1,n=S.inv[o]||0,sc=scanFor(o);
    st(built,built?_t('La Fonderie est construite.'):_t('Construis la Fonderie : onglet 🚀 ORION, salle 🔥 Fonderie.'));
    if(sc)st(L(sc.id)>0,(L(sc.id)>0?'':_t('Installe d’abord le détecteur dans l’Arbre : ')+sc.n+'. ')+_t('Le minerai le plus rare de ta planète apparaît loin du vaisseau.'));
    st(n>=FOND_N,_t('Récolte 100')+' '+gemHTML(o)+ORES[o].n+' '+_t('pour une fournée')+' ('+_t('tu en as')+' '+fmt(n)+').');
    st(false,_t('Lance « Fondre » : 1 lingot toutes les 5 minutes, même jeu fermé. Améliore la Fonderie pour mettre plus de fournées en file.'));
    btn.push([_t('🔥 Aller à la Fonderie'),()=>goRoom('fonderie')]);if(sc&&!L(sc.id))btn.push([_t('🌳 Ouvrir l’Arbre'),()=>goTree(sc.id)]);btn.push([_t('🛒 Acheter'),()=>openLingots(),'s']);}
  else if(r==='noyaux'){ic='⚛️';st(GL('scan')>=1,_t('Les caches de ressources (Scanner avancé) en contiennent parfois.'));st(false,_t('Chaque Cœur de planète vaincu en donne un.'));st(false,_t('La boutique en vend, et on peut en échanger contre des étoiles.'));btn.push([_t('🛒 Voir les noyaux'),()=>openNoyaux()]);}
  else if(ORES[r]){ic='';const pl=PLANETS.findIndex(P=>P.ores.includes(r)),here=pl===S.planet,ul=unlockedOres().includes(r),sc=scanFor(r);
    if(pl!==HOMEP()&&!here){st(false,_t('Ce minerai vient de')+' '+(PLANETS[pl]||{n:'?'}).n+'. '+_t('Retournes-y avec le portail spatio-temporel (bouton 🌌).'));btn.push([_t('🌌 Carte galactique'),()=>{$('modal').classList.remove('show');openGalaxy();}]);}
    else{if(sc)st(ul,ul?_t('Son détecteur est installé.'):_t('Installe son détecteur dans l’Arbre : ')+sc.n+'.');
      st(have(r)>=q,_t('Récolte-le pendant tes sorties')+' ('+fmt(have(r))+' / '+fmt(q)+'). '+_t('Plus un minerai est rare, plus il se trouve loin du vaisseau.'));
      st(false,_t('Astuces : « Densité » et « Filon riche » dans l’Arbre en rapportent plus, les drones en récoltent même jeu fermé.'));
      if(sc&&!ul)btn.push([_t('🌳 Ouvrir l’Arbre'),()=>goTree(sc.id)]);btn.push([_t('🧑‍🚀 Sortir explorer'),()=>{$('modal').classList.remove('show');tab='tree';full=true;renderHub();setTimeout(()=>{const b=$('bGo');if(b)b.click();},120);}]);}}
  modal('<div style="display:flex;align-items:center;gap:10px;text-align:left"><div style="font-size:34px">🤖</div><div><div class="mu">LUMI</div><div class="nm" style="font-size:16px">'+_t('Il te manque :')+' '+(ic||gemHTML(r))+' '+fmt(Math.max(0,q-have(r)))+' '+name+'</div></div></div><div class="card" style="text-align:left;margin-top:8px">'+
    steps.map((x,i)=>'<div class="gal-r" style="align-items:flex-start"><span style="font-size:15px">'+(x[0]?'✅':(i+1)+'.')+'</span><span>'+x[1]+'</span></div>').join('')+'</div>',btn.concat([[_t('Merci LUMI !'),null,'s']]));}
// ---------- B1. objectif guidé ----------
function goalNow(){if(!S||run)return null;const P=PL();if(isVisit())return{t:_t('Visite de')+' '+P.n+' : '+_t('explore ce qu’il reste à découvrir'),go:()=>openGalaxy()};
  const parts=P.parts.map((pt,i)=>({pt,i})).filter(z=>!S.parts.includes(z.i));
  const radio=parts.find(z=>z.pt.story==='radio');if(radio)return{t:_t('Répare la')+' '+radio.pt.n+' ('+_t('onglet ORION')+')',go:()=>goRoom('cockpit')};
  const can=parts.find(z=>canPay(partCost(z.pt)));if(can)return{t:'🔧 '+_t('Tu peux réparer :')+' '+can.pt.i+' '+can.pt.n,go:()=>{tab='ship';full=false;renderHub();setTimeout(()=>{const e=$('ship');if(e)e.scrollTop=1e5;},60);}};
  if(!parts.length){if(bossReady())return{t:'👹 '+_t('Affronte le Cœur de')+' '+P.n,go:()=>{tab='ship';full=false;renderHub();}};return{t:'🚀 '+_t('Tout est réparé : décolle !'),go:()=>{tab='ship';full=false;renderHub();setTimeout(()=>{const e=$('ship');if(e)e.scrollTop=1e5;},60);}};}
  const tool=SK.find(s=>s.tool&&skAvail(s)&&!L(s.id));if(tool&&canPay(skCost(tool)))return{t:'⛏️ '+_t('Nouvel outil disponible :')+' '+tool.n,go:()=>goTree(tool.id)};
  const nx=parts[0],c=partCost(nx.pt);const miss=Object.keys(c).find(r=>have(r)<c[r]);if(miss){const sc=scanFor(miss);if(sc&&!L(sc.id))return{t:'📡 '+_t('Installe le détecteur')+' '+sc.n+' '+_t('pour trouver')+' '+ORES[miss].n,go:()=>goTree(sc.id)};
    return{t:'🎯 '+nx.pt.i+' '+nx.pt.n+' : '+_t('encore')+' '+fmt(c[miss]-have(miss))+' '+ORES[miss].n,go:()=>needHelp(miss,c[miss])};}
  return null;}
function goalBar(){const e=$('goalBar');if(!e)return;const g=(mode==='hub')?goalNow():null;window.GOALF=g&&g.go;e.className=g?'on':'';e.innerHTML=g?'<button onclick="GOALF&&GOALF()"><span style="font-size:18px">🎯</span><span class="grow"><b>'+_t('Objectif')+'</b> · '+g.t+'</span><span>›</span></button>':'';}
// ---------- B2. file d'attente du laboratoire ----------
function labQueueAdd(id){const sub=labSubjects().find(z=>z.id===id);if(!sub)return;S.labQ=S.labQ||[];if(S.labQ.length>=2||S.labQ.some(q=>q.id===id)||(S.lab&&S.lab.id===id))return;const st=labStage(id)+(S.labQ.filter(q=>q.id===id).length);if(st>=4)return;const c=labCost(sub,st);if(!canPay(c))return;pay(c);S.labQ.push({id,k:sub.k,st});AU.buy();save();renderHub();toast('🔬 '+_t('Ajouté à la file :')+' '+sub.n);}
function labQueueNext(endAt){S.labQ=S.labQ||[];if(S.lab||!S.labQ.length)return;const q=S.labQ.shift();S.lab={id:q.id,end:(endAt||Date.now())+labDur(q.st),k:q.k};}
// ---------- B3. fonderie automatique ----------
function fondAutoFill(){if(!S||!S.fondAuto||RM('fonderie')<1)return;const F=S.fond||(S.fond={q:0,end:0});const t=fondOre(),room=fondMaxQ()-F.q,can=Math.min(room,Math.floor((S.inv[t]||0)/FOND_N));if(can>0){S.inv[t]-=can*FOND_N;if(F.q<=0)F.end=Date.now()+fondDur();F.q+=can;}}
// ---------- B5. bilan de sortie : où en est le décollage ----------
function sumProgressHTML(){if(isVisit()||run&&run.deep)return'';const P=PL(),tot=P.parts.length,done=S.parts.length;const nx=P.parts.map((pt,i)=>({pt,i})).find(z=>!S.parts.includes(z.i));
  let h='<div class="card" style="text-align:left;margin-top:8px"><div class="mu">🚀 '+_t('Décollage :')+' <b style="color:var(--tx)">'+done+'/'+tot+'</b> '+_t('modules réparés')+'</div><div class="pbar" style="margin-top:4px"><i style="width:'+Math.round(done/tot*100)+'%;background:linear-gradient(90deg,#ffb648,#62e0a2)"></i></div>';
  if(nx){const c=partCost(nx.pt);h+='<div class="mu" style="margin-top:6px">'+_t('Prochain module :')+' '+nx.pt.i+' <b style="color:var(--tx)">'+nx.pt.n+'</b></div>'+Object.keys(c).map(r=>{const pc=Math.min(1,have(r)/c[r]);return '<div style="display:flex;align-items:center;gap:6px;font-size:12px;margin-top:3px"><span style="width:92px">'+gemHTML(r)+rName(r)+'</span><div class="pbar" style="flex:1;margin:0"><i style="width:'+Math.round(pc*100)+'%;background:'+(pc>=1?'var(--ok)':'#6fe3ff')+'"></i></div><b style="width:78px;text-align:right">'+fmt(have(r))+'/'+fmt(c[r])+'</b></div>';}).join('');}
  return h+'</div>';}
function doPrestige(){try{albumAdd('🪐',_t('Départ de ')+PL().n+' → '+(PLANETS[S.planet+1]||{n:'?'}).n);}catch(e){}const g=prestigeGain();S.pp=(S.pp||0)+g;S.planet++;lumiPend('lumi_world');S.parts=[];S.sk={};S.contracts=[];S.pBlocks=0;const ling=S.inv.lingots||0;S.inv={lingots:ling};S.items={};
  if(PK('p_kit')){S.sk.t1=1;S.sk.scan_fer=1;}if(PK('p_tool2')){S.sk.t2=1;S.sk.scan_cuivre=1;}
  setTimeout(()=>lumiSay(_t('Nouveau rang technologique ! Tes dégâts sont multipliés, et les anciennes planètes sont devenues faciles. Le bouton 🌌 en haut ouvre le portail.'),7),9000);
  genWorld();cam.x=SHIP.x;cam.y=SHIP.y;tab='tree';selSk=null;treeCentered=false;save();return g;}
